[package]
name = "agent_tower_sim"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent_tower_sim"
path = "src/main.rs"

[[example]]
name = "run_summary"
path = "examples/run_summary.rs"

[[bench]]
name = "tick_throughput"
harness = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
md5 = "0.8.1"
rand = "0.10"
redis = { version = "1.8", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"
